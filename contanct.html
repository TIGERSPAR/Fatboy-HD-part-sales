<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - FATBOY HD Parts</title>
  <link rel="stylesheet" href="st.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .contact-section {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      padding: 60px 20px;
      max-width: 1200px;
      margin: auto;
    }
    .contact-form, .contact-map {
      flex: 1 1 400px;
    }
    .contact-form h2 {
      margin-bottom: 20px;
    }
    .contact-form form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .contact-form input,
    .contact-form textarea {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    .contact-form button {
      background: var(--primary);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
    iframe {
      width: 100%;
      height: 300px;
      border: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">FATBOY HD</div>
  <nav>
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contanct.html" class="active">Contact</a></li>
      <li><a href="chart-1.html">chart</a></li>
    </ul>
  </nav>
  <div class="dark-toggle" onclick="toggleDarkMode()">
    <i class="fas fa-moon"></i>
  </div>
</header>

<div class="cart-icon">
  🛒 <span id="cart-count">0</span>
</div>

<section class="contact-section">
  <div class="contact-form">
    <h2>Contact Us</h2>
    <form action="#" onsubmit="event.preventDefault(); alert('Message sent!');">
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <div class="contact-map">
    <h2>Find Us</h2>
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1984.7273552856368!2d10.1734076!3d5.9630514!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x10613334eebcfbbb%3A0x3330f1c9b0cdddf5!2sBamenda!5e0!3m2!1sen!2scm!4v1655489795302!5m2!1sen!2scm" allowfullscreen="" loading="lazy"></iframe>
  </div>
</section>

<footer>
  <p>&copy; 2025 FATBOY HD Parts Sales. All rights reserved.</p>
  <div class="social-links">
    <a href="#"><i class="fab fa-facebook-f"></i></a>
    <a href="#"><i class="fab fa-instagram"></i></a>
    <a href="#"><i class="fab fa-whatsapp"></i></a>
  </div>
</footer>

<script>
  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  document.getElementById("cart-count").textContent = cart.length;
</script>
<script src="main.js"></script>
</body>
</html>
